name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: macos-15
    name: Security Scan
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for app in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode.app \
            /Applications/Xcode_16.2.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Install Trivy
        run: brew install trivy

      - name: Audit dependencies
        run: swift package audit 2>/dev/null || echo "swift package audit not available — skipping"
        continue-on-error: true

      - name: Build
        run: swift build

      - name: Run security scan
        run: ./scripts/security-scan.sh
