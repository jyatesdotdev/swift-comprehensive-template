name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          for app in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode.app \
            /Applications/Xcode_16.2.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      # `swift test` hangs in swiftpm-testing after "Build complete" on
      # GitHub-hosted macOS (TTY/`script` does not help). xcodebuild uses
      # Xcode's test runner instead. Coverage stays `make coverage` locally.
      - name: Tests
        run: |
          xcodebuild -list
          xcodebuild test \
            -scheme SwiftTemplate-Package \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict


