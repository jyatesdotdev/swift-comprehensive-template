name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          for app in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode.app \
            /Applications/Xcode_16.2.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      # Coverage stays local (`make coverage`): --enable-code-coverage hangs
      # swiftpm-testing on GitHub-hosted macOS. Give tests a TTY; piped stdin
      # has hung the runner after "Build complete" on macos-14.
      - name: Tests
        run: script -q /dev/null swift test --verbose

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict


